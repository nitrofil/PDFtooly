	/* Style du spinner */
	#loading-spinner {
		display: none;
		width: 70px;
		height: 70px;
		border: 7px solid #AAAAAA;
		border-top: 7px solid rgb(22, 107, 162);
		border-radius: 70%;
		animation: spin 1.5s linear infinite;
		position: fixed;  /* Positionner par rapport à la fenêtre */
		top: 50%;  /* Centrer verticalement */
		left: 46.16%;  /* Centrer horizontalement */
		transform: translate(-50%, -50%);  /* Ajuster pour un centrage parfait */
		z-index: 9999;  /* Placer le spinner au-dessus des autres éléments */
		text-align: center;
	}

    /* Animation du spinner */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

	/* Désactiver les interactions */
		body.loading {
		pointer-events: none; /* Désactiver les interactions pendant le chargement */
	}
	
	#loading-text {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		font-size: 12px;
		color: rgb(22, 107, 162); /* Même couleur que la bordure supérieure */
		font-weight: bold;
		text-transform: uppercase;
	}
	
	/* Masquer les éléments par défaut */
    .hidden {
        display: none;
    }

<div style="margin-top: 150px;">
    <p>Sélectionnez un fichier .pdf afin de le diviser en plusieurs fichiers PDF.</p>
    <div id="controls" style="display: flex; align-items: center; gap: 10px;">
        <input type="file" id="pdf-upload" accept="application/pdf" />
        <label for="split-options" id="label-split" class="hidden">Diviser en :</label>
        <select id="split-options" class="hidden"></select>
        <button id="split-pdf" class="hidden">Diviser le PDF</button>
        <label for="three-per-row-checkbox" id="label-checkbox" class="hidden">&emsp;Réduire :</label>
        <input type="checkbox" id="three-per-row-checkbox" class="hidden" />
        <div id="loading-spinner"><span id="loading-text">Chargement...</span></div>
    </div>
    <div id="preview-container"></div> <!-- Conteneur pour les aperçus -->

    <script src="https://unpkg.com/pdf-lib"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

    <script>
        const pdfUpload = document.getElementById('pdf-upload');
        const splitButton = document.getElementById('split-pdf');
        const splitOptions = document.getElementById('split-options');
        const previewContainer = document.getElementById('preview-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const threePerRowCheckbox = document.getElementById('three-per-row-checkbox');

        let loadedPdfBytes = null;
        let numPages = 0;
        let originalFileName = '';

        // Initialisation des éléments
        window.addEventListener('load', function () {
            threePerRowCheckbox.checked = false;
            pdfUpload.value = '';
            document.getElementById('label-split').style.display = 'none';
            document.getElementById('split-options').style.display = 'none';
            document.getElementById('split-pdf').style.display = 'none';
            document.getElementById('label-checkbox').style.display = 'none';
            document.getElementById('three-per-row-checkbox').style.display = 'none';

        });

        // Mise à jour des options de division
        function updateSplitOptions(maxParts) {
            splitOptions.innerHTML = '';
            for (let i = 2; i <= Math.min(maxParts, 10); i++) {
                const option = document.createElement('option');
                option.value = i;
                option.text = `${i} parties`;
                splitOptions.appendChild(option);
            }
        }

        // Chargement et prévisualisation du PDF
        pdfUpload.addEventListener('change', async function (event) {
            const file = event.target.files[0];
            if (!file || file.type !== 'application/pdf') {
                alert('Veuillez télécharger un fichier PDF');
                return;
            }

            originalFileName = file.name.replace(/\.pdf$/, '');
            const fileReader = new FileReader();
			
		document.body.classList.add('loading');// Ajout de la classe "loading" pour désactiver les interactions
	
            fileReader.onload = async function (e) {
                try {
                    loadedPdfBytes = new Uint8Array(e.target.result);
                    const pdfDoc = await PDFLib.PDFDocument.load(loadedPdfBytes);
                    numPages = pdfDoc.getPageCount();
                    updateSplitOptions(numPages);

                    alert(`Le fichier PDF contient ${numPages} pages. Vous pouvez le diviser jusqu'à ${Math.min(numPages, 10)} parties.`);

                    const loadingTask = pdfjsLib.getDocument({ data: loadedPdfBytes });
                    const pdf = await loadingTask.promise;

                    previewContainer.innerHTML = '';
					threePerRowCheckbox.checked = false; // La case est décochée par défaut
                    loadingSpinner.style.display = 'block';

                    for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const viewport = page.getViewport({ scale: 0.95 });

                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        await page.render(renderContext).promise;

                        const div = document.createElement('div');
                        div.classList.add('page-preview');
                        div.appendChild(canvas);

                        previewContainer.appendChild(div);
                    }
                } catch (error) {
                    console.error('Erreur lors du rendu des miniatures:', error);
                } finally {
                    loadingSpinner.style.display = 'none';
            document.body.classList.remove('loading');// Retire la classe "loading" une fois le traitement terminé
                    document.getElementById('label-split').style.display = 'block';
                    document.getElementById('split-options').style.display = 'block';
                    document.getElementById('split-pdf').style.display = 'block';
                    document.getElementById('label-checkbox').style.display = 'block';
                    document.getElementById('three-per-row-checkbox').style.display = 'block';
					
                }
            };
            fileReader.readAsArrayBuffer(file);
        });

        // Ajuster la largeur des aperçus
        threePerRowCheckbox.addEventListener('change', function () {
            const isChecked = threePerRowCheckbox.checked;
            const canvases = previewContainer.querySelectorAll('canvas');
            canvases.forEach(function (canvas) {
                canvas.style.maxWidth = isChecked ? '268px' : '360px';
            });
        });

        // Division du PDF
        splitButton.addEventListener('click', async function () {
            if (!loadedPdfBytes) {
                alert("Veuillez d'abord charger un fichier PDF.");
                return;
            }

            const numParts = parseInt(splitOptions.value);
            if (numParts > numPages) {
                alert("Le nombre de parties ne peut pas dépasser le nombre de pages du PDF.");
                return;
            }

            const originalPdf = await PDFLib.PDFDocument.load(loadedPdfBytes);
            const pagesPerPart = Math.floor(numPages / numParts);
            const remainingPages = numPages % numParts;

            let currentPageIndex = 0;

            for (let part = 0; part < numParts; part++) {
                const newPdf = await PDFLib.PDFDocument.create();
                const startPage = currentPageIndex;
                const endPage = startPage + pagesPerPart + (part < remainingPages ? 1 : 0);

                const pagesToCopy = await newPdf.copyPages(originalPdf, Array.from({ length: endPage - startPage }, (v, k) => k + startPage));
                pagesToCopy.forEach((page) => newPdf.addPage(page));

                currentPageIndex = endPage;

                const newPdfBytes = await newPdf.save();
                const blob = new Blob([newPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${originalFileName}_part_${part + 1}.pdf`;
                link.click();// Déclenche le téléchargement
            }
        });
    </script>
