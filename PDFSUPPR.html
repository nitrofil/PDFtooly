<style>
	#page-previews {
		display: flex;
		flex-wrap: wrap;
		margin-top: -10px; /* Déplacer la première ligne de 10px vers le haut */
	}

	.page-preview {
		margin: 5px; /* Espacement de 5px autour de chaque aperçu */
		display: inline-block;
		position: relative;
		text-align: center;
		border: 1px solid #ccc; /* Bordure légère autour de l'image */
		box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4); /* Ombre légère sous l'image */
		border-radius: 8px; /* Coins arrondis */
		left: -5px; /* Décalage vers la gauche */
		top: 5px; /* Décalage vers le haut */
	}

	.page-preview canvas {
		max-width: 358px;  /* Taille des miniatures */
		border-radius: 8px; /* Coins arrondis */
	}

	.checkbox-overlay {
		position: absolute;
		top: 18px;
		left: 38%;
		background-color: rgba(255, 255, 255, 0.8); /* Fond blanc transparent */
		padding: 5px;
		border: 2px solid red; /* Bordure rouge */
		border-radius: 5px;
		box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); /* Ombre sous l'image */
	}

	.checkbox-overlay input[type="checkbox"] {
		transform: scale(1.5); /* Agrandir la case à cocher */
	}

	#controls {
		margin-bottom: 20px;
	}

	.icon-intero {
		position: fixed;
		top: 10px;
		right: 10px;
	}

	.icon-linkintero {
		text-decoration: none;
		color: black;
		font-size: 24px;
	}

	/* Changer la couleur du lien lorsque la souris le survole */
	.icon-linkintero:hover {
		color: green; /* Couleur au survol */
	}

	/* Style du spinner */
	#loading-spinner {
		display: none;
		width: 70px;
		height: 70px;
		border: 7px solid #AAAAAA;
		border-top: 7px solid rgb(27, 54, 81);
		border-radius: 70%;
		animation: spin 1.5s linear infinite;
		position: fixed;  /* Positionner par rapport à la fenêtre */
		top: 50%;  /* Centrer verticalement */
		left: 46.16%;  /* Centrer horizontalement */
		transform: translate(-50%, -50%);  /* Ajuster pour un centrage parfait */
		z-index: 9999;  /* Placer le spinner au-dessus des autres éléments */
		text-align: center;
	}

    /* Animation du spinner */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

	/* Désactiver les interactions */
		body.loading {
		pointer-events: none; /* Désactiver les interactions pendant le chargement */
	}
	
	#loading-text {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		font-size: 12px;
		color: rgb(27, 54, 81); /* Même couleur que la bordure supérieure */
		font-weight: bold;
		text-transform: uppercase;
	}
	
	/* Masquer les éléments par défaut */
    .hidden {
        display: none;
    }
</style>

	<div style="margin-top: 150px;">
	<P>Séléctionnez un fichier .pdf afin de pouvoir supprimer des pages et recomplier un PDF modifié.</P></div>
    <div id="controls" style="display: flex; align-items: center; gap: 10px;">
        <input type="file" id="pdf-upload" accept="application/pdf"/>
        <button id="generate-pdf" class="hidden">Générer PDF sans les pages sélectionnées</button><label for="three-per-row-checkbox" id="label-checkbox" class="hidden">&emsp;Réduire :</label><input type="checkbox" id="three-per-row-checkbox" class="hidden">&nbsp;
			    <div id="loading-spinner"><span id="loading-text">Chargement</span></div><!-- Spinner de chargement -->
    </div>
    <div id="page-previews"></div>

    <!-- pdfjs-dist pour prévisualiser les pages PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <!-- pdf-lib pour manipuler le PDF -->
    <script src="https://unpkg.com/pdf-lib"></script>

<script>
    const pdfUpload = document.getElementById('pdf-upload');
    const generatePdfButton = document.getElementById('generate-pdf');
    const pagePreviews = document.getElementById('page-previews');
    const loadingSpinner = document.getElementById('loading-spinner');

    let loadedPdf = null;
    let pdfDoc = null;

    // Fonction pour prévisualiser le PDF
    pdfUpload.addEventListener('change', async function(event) {
        const file = event.target.files[0];
        if (!file || file.type !== 'application/pdf') {
            alert('Veuillez télécharger un fichier PDF.');
            return;
        }

    // Afficher le spinner et désactiver les interactions pendant le traitement
    document.body.classList.add('loading');// Ajout de la classe "loading" pour désactiver les interactions
	threePerRowCheckbox.checked = false;
    loadingSpinner.style.display = 'block';

        try {
            const fileReader = new FileReader();
            fileReader.onload = async function(e) {
                const pdfData = new Uint8Array(e.target.result);
                const loadingTask = pdfjsLib.getDocument({ data: pdfData });
                pdfDoc = await loadingTask.promise;

                pagePreviews.innerHTML = ''; // Effacer les aperçus précédents

                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.0 });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport,
                    };

                    await page.render(renderContext).promise;

                    const pagePreview = document.createElement('div');
                    pagePreview.classList.add('page-preview');
                    pagePreview.appendChild(canvas);

	// Ajouter un overlay avec une case à cocher
	const checkboxOverlay = document.createElement('div');
	checkboxOverlay.classList.add('checkbox-overlay');
	const checkbox = document.createElement('input');
	checkbox.type = 'checkbox';
	checkbox.dataset.pageNumber = pageNum; // Définir la page à exclure
	checkboxOverlay.appendChild(checkbox);

	// Ajouter le texte "Exclure" à côté de la case à cocher
    const label = document.createElement('label');
    label.textContent = ' Exclure';
    checkboxOverlay.appendChild(label);

	pagePreview.appendChild(checkboxOverlay);
    pagePreviews.appendChild(pagePreview);
		}

    // Cacher le spinner et activer les interactions
    loadingSpinner.style.display = 'none';
	document.getElementById('generate-pdf').style.display = 'block';	
	document.getElementById('label-checkbox').style.display = 'block';		
	document.getElementById('three-per-row-checkbox').style.display = 'block';
    document.body.classList.remove('loading');
    };

	fileReader.readAsArrayBuffer(file);
    } catch (error) {
        console.error('Erreur de chargement du PDF:', error);
        alert('Une erreur s\'est produite lors du traitement du PDF.');
        loadingSpinner.style.display = 'none';
        document.body.classList.remove('loading');
		}
	});

    // Générer un nouveau PDF sans les pages sélectionnées
	generatePdfButton.addEventListener('click', async function() {
    if (!pdfDoc) {
        //alert("Veuillez d'abord charger un fichier PDF.");
        return;
    }

    const excludedPages = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
        .map(checkbox => parseInt(checkbox.dataset.pageNumber) - 1); // Récupérer le numéro de la page à exclure

    const originalPdfBytes = await pdfUpload.files[0].arrayBuffer();
    const originalPdf = await PDFLib.PDFDocument.load(originalPdfBytes);
    const newPdf = await PDFLib.PDFDocument.create();

    // Copier uniquement les pages non sélectionnées
    let hasPages = false; // Vérifier s'il y a des pages à ajouter
    for (let i = 0; i < pdfDoc.numPages; i++) {
        if (!excludedPages.includes(i)) {
            hasPages = true;
            const [page] = await newPdf.copyPages(originalPdf, [i]);
            newPdf.addPage(page);
        }
    }

    if (!hasPages) {
        alert("Le PDF ne sera pas généré sans au minimum 1 page !");
        return;
    }

    const newPdfBytes = await newPdf.save();
    const blob = new Blob([newPdfBytes], { type: 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${pdfUpload.files[0].name.replace('.pdf', '_modifié.pdf')}`;
    link.click();
});

	// Récupère l'élément checkbox
    const threePerRowCheckbox = document.getElementById('three-per-row-checkbox');

    // Fonction pour ajuster la largeur des miniatures en fonction de la case à cocher
    function updatePreviewWidth() {
        const maxWidth = threePerRowCheckbox.checked ? '266px' : '358px';  // Change la largeur en fonction de la case
        const imageContainers = document.querySelectorAll('.page-preview canvas');
        imageContainers.forEach(container => {
            container.style.maxWidth = maxWidth;
        });
    }

    // Lors du changement de la case à cocher, on met à jour la largeur
    threePerRowCheckbox.addEventListener('change', updatePreviewWidth);

    // Initialisation : on s'assure que la case est décochée au chargement de la page
    window.addEventListener('load', function() {
        threePerRowCheckbox.checked = false; // La case est décochée par défaut
		document.getElementById('pdf-upload').value = "";// Réinitialiser l'entrée de fichier
		document.getElementById('generate-pdf').style.display = 'none';
		document.getElementById('label-checkbox').style.display = 'none';
		document.getElementById('three-per-row-checkbox').style.display = 'none';		
        updatePreviewWidth(); // Applique la largeur initiale
    });
</script>
