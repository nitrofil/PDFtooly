<style>
	#images-container {
		display: flex;
		flex-wrap: wrap;
		gap: 10px; /* Espace de 10px entre chaque image */
		margin-top: 20px;
	}

	.image-container {
		position: relative;
		display: inline-block;
		max-width: 360px;   /* Limite la largeur maximale à 360px */
		text-align: center; /* Centrer le contenu */
		background-color: #f9f9f9;
		border-radius: 8px;
		padding-top: 0px; /* Ajout d'espace en haut pour le bouton */
		box-sizing: border-box; /* S'assurer que le padding et la bordure n'affectent pas la taille de l'élément */
		box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); /* Ombre sous l'image */
	}

	.image-container img {
	display: block;
		width: 100%;  /* Les images redimensionnées à 100% du conteneur */
		max-width: 100%; /* Assure que l'image ne dépasse pas la largeur du conteneur */
		height: auto; /* Maintient le ratio de l'image */
		border: 1px solid #ccc;
		border-radius: 8px;
		z-index: 1; /* S'assurer que l'image est en dessous du bouton */
	}

	.download-btn {
		font-size: 14px;
		font-weight: bold;
		color: #333;
		padding: 5px 10px;
		border: 2px solid #007bff;
		border-radius: 5px;
		background-color: #eef6ff;
		position: absolute;
		top: 20px; /* Positionner le bouton 10px sous le début de l'aperçu */
		left: 50%;
		transform: translateX(-50%); /* Centrer horizontalement */
		z-index: 2; /* Assurer que le bouton est au-dessus de l'image */
		box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); /* Ombre sous l'image */
	}

	.download-btn:hover {
		background-color: #45a049;
		color: white;
	}

	.download-btn:focus {
		outline: none;
		box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
	}

    .icon-intero {
        position: fixed;
        top: 10px;
        right: 10px;
    }
    .icon-linkintero {
        text-decoration: none;
        color: black;
        font-size: 24px;
    }
    .icon-linkintero:hover {
        color: green;
    }

	/* Style du spinner */
	#loading-spinner {
		display: none;
		width: 70px;
		height: 70px;
		border: 7px solid #AAAAAA;
		border-top: 7px solid rgb(208, 101, 3);
		border-radius: 70%;
		animation: spin 1.5s linear infinite;
		position: fixed;  /* Positionner par rapport à la fenêtre */
		top: 50%;  /* Centrer verticalement */
		left: 46.16%;  /* Centrer horizontalement */
		transform: translate(-50%, -50%);  /* Ajuster pour un centrage parfait */
		z-index: 9999;  /* Placer le spinner au-dessus des autres éléments */
		text-align: center;
		/*box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);  /* Ombre fixe sous le spinner */
	}

    /* Animation du spinner */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

	/* Désactiver les interactions */
		body.loading {
		pointer-events: none; /* Désactiver les interactions pendant le chargement */
	}
	
	#loading-text {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		font-size: 12px;
		color: rgb(208, 101, 3); /* Même couleur que la bordure supérieure */
		font-weight: bold;
		text-transform: uppercase;
	}
	
	/* Masquer les éléments par défaut */
    .hidden {
        display: none;
    }
</style>

        <div style="margin-top: 150px;">
            <p>Séléctionnez un fichier .PDF afin de le convertir en image JPG.</p>
            <div style="display: flex; align-items: center; gap: 10px;"><input type="file" id="pdf-upload" accept="application/pdf"/><label for="three-per-row-checkbox" id="label-checkbox" class="hidden">&emsp;Réduire :</label><input type="checkbox" id="three-per-row-checkbox" class="hidden">&emsp;<button id="downloadAllImages" class="hidden">Télécharger tout</button></div>
			    <div id="loading-spinner"><span id="loading-text">Chargement</span></div><!-- Spinner de chargement -->
        </div>
        <div id="images-container"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
        <script>
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

            const pdfUpload = document.getElementById('pdf-upload');
            const imagesContainer = document.getElementById('images-container');
			const loadingSpinner = document.getElementById('loading-spinner');
					
            let originalFileName = '';

		pdfUpload.addEventListener('change', async function(event) {
    const file = event.target.files[0];
    if (file.type !== 'application/pdf') {
        alert('Veuillez télécharger un fichier PDF');
        return;
    }

    originalFileName = file.name.replace(/\.pdf$/, '');  // Nom sans l'extension .pdf

    const fileReader = new FileReader();

    fileReader.onload = async function() {
        const typedArray = new Uint8Array(this.result);

        // Charger le PDF
        const pdf = await pdfjsLib.getDocument(typedArray).promise;
        const numPages = pdf.numPages;

        imagesContainer.innerHTML = '';// Effacer les images existantes avant d'ajouter de nouveaux aperçus
		threePerRowCheckbox.checked = false; // La case est décochée par défaut

		// Afficher le spinner et désactiver les interactions 
		document.body.classList.add('loading');					
        loadingSpinner.style.display = 'block';

        // Boucle pour rendre les pages dans l'ordre
        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
            const page = await pdf.getPage(pageNum); // Attente de la page avant de continuer
            const viewport = page.getViewport({ scale: 1.4 }); // Ajustez l'échelle pour l'aperçu
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };

            try {
                await page.render(renderContext).promise;  // Attente du rendu de la page

                // Créer l'image d'aperçu avec une bonne qualité (0.7)
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/jpeg', 0.7); // Aperçu avec une qualité raisonnable
                
                // Redimensionner l'aperçu à 400px de large
                img.style.width = '400px';

                const imageContainer = document.createElement('div');
                imageContainer.classList.add('image-container');
                imageContainer.appendChild(img);

                const button = document.createElement('button');
                button.textContent = `Télécharger page ${pageNum}`;
                button.classList.add('download-btn');
                button.onclick = function() {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/jpeg', 1.0); // Export avec une qualité maximale
                    link.download = `${originalFileName}_page-${pageNum}.jpg`;
                    link.click();
                };

                imageContainer.appendChild(button);
                imagesContainer.appendChild(imageContainer);
            } catch (error) {
                console.error("Erreur lors du rendu de la page:", error);
            }
        }
		
		// Masquer le spinner et réactiver les interactions
        loadingSpinner.style.display = 'none';
		document.getElementById('downloadAllImages').style.display = 'block'; // Le bouton est affiché
		document.getElementById('label-checkbox').style.display = 'block';		
		document.getElementById('three-per-row-checkbox').style.display = 'block';
		document.body.classList.remove('loading');
    };

    fileReader.readAsArrayBuffer(file);
});
</script>

<script>
    var changeClass = function (r, className1, className2) {
        var regex = new RegExp("(?:^|\\s+)" + className1 + "(?:\\s+|$)");
        if (regex.test(r.className)) {
            r.className = r.className.replace(regex, ' ' + className2 + ' ');
        } else {
            r.className = r.className.replace(new RegExp("(?:^|\\s+)" + className2 + "(?:\\s+|$)"), ' ' + className1 + ' ');
        }
        return r.className;
    };

    var menuElements = document.getElementById('menu');
    menuElements.insertAdjacentHTML('afterBegin', '<button type="button" id="menutoggle" class="navtoogle" aria-hidden="true"><i aria-hidden="true" class="icon-menu"> </i> Menu</button>');
    document.getElementById('menutoggle').onclick = function() {
        changeClass(this, 'navtoogle active', 'navtoogle');
    }
    document.onclick = function(e) {
        var mobileButton = document.getElementById('menutoggle'),
            buttonStyle = mobileButton.currentStyle ? mobileButton.currentStyle.display : getComputedStyle(mobileButton, null).display;
        if (buttonStyle === 'block' && e.target !== mobileButton && new RegExp(' ' + 'active' + ' ').test(' ' + mobileButton.className + ' ')) {
            changeClass(mobileButton, 'navtoogle active', 'navtoogle');
        }
    }
	// Fonction pour télécharger toutes les images
	const downloadAllImagesButton = document.getElementById('downloadAllImages');

	downloadAllImagesButton.addEventListener('click', function() {
    const downloadButtons = document.querySelectorAll('.download-btn');
    if (downloadButtons.length === 0) {
        alert('Aucune image à télécharger.');
        return;
    }

    // Boucle sur tous les boutons individuels pour déclencher un clic
    downloadButtons.forEach(button => button.click());
});
</script>

<script>
    // Récupère l'élément checkbox
    const threePerRowCheckbox = document.getElementById('three-per-row-checkbox');

    // Fonction pour ajuster la largeur des miniatures en fonction de la case à cocher
    function updatePreviewWidth() {
        const maxWidth = threePerRowCheckbox.checked ? '268px' : '360px';  // Change la largeur en fonction de la case
        const imageContainers = document.querySelectorAll('.image-container');
        imageContainers.forEach(container => {
            container.style.maxWidth = maxWidth;
        });
    }

    // Lors du changement de la case à cocher, on met à jour la largeur
    threePerRowCheckbox.addEventListener('change', updatePreviewWidth);

    // Initialisation : on s'assure que la case est décochée au chargement de la page
    window.addEventListener('load', function() {
        threePerRowCheckbox.checked = false; // La case est décochée par défaut
		document.getElementById('pdf-upload').value = "";// Réinitialiser l'entrée de fichier
		document.getElementById('downloadAllImages').style.display = 'none'; // Le bouton est masqué
		document.getElementById('label-checkbox').style.display = 'none';
		document.getElementById('three-per-row-checkbox').style.display = 'none';
        updatePreviewWidth(); // Applique la largeur initiale
    });
</script>
