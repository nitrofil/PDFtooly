	<div style="margin-top: 150px;">
	<P>Séléctionnez un fichier .pdf afin d'appliquer à la/aux page(s) une rotation de 90° vers la droite.</P>

    <div class="controls" style="display: flex; align-items: center; gap: 10px;">
        <input type="file" id="file-input" accept="application/pdf">
        <button id="save-btn" class="hidden">Enregistrer le PDF</button><label for="three-per-row-checkbox" id="label-checkbox" class="hidden">&emsp;Réduire :</label><input type="checkbox" id="scale-toggle" class="hidden">&nbsp;

<!-- Charger les bibliothèques nécessaires -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
    const fileInput = document.getElementById('file-input');
    const pdfPreview = document.getElementById('pdf-preview');
    const loadingSpinner = document.getElementById('loading-spinner');
    const scaleToggle = document.getElementById('scale-toggle'); // Case à cocher pour l'échelle
    const saveBtn = document.getElementById('save-btn'); // Bouton enregistrer
    const labelCheckbox = document.getElementById('label-checkbox'); // Label pour la case à cocher
    let pdfDoc = null;
    let rotations = [];
    let originalPdfBytes = null;
    let fileName = '';

    // Gestion du changement de fichier
    fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file && file.type === 'application/pdf') {
            fileName = file.name;
            const fileReader = new FileReader();
			
			scaleToggle.checked = false; // Optionnel: réinitialise la case à cocher
			
            // Afficher le spinner et désactiver les interactions
            document.body.classList.add('loading');
            loadingSpinner.style.display = 'block';

            fileReader.onload = function () {
                originalPdfBytes = new Uint8Array(this.result);
                pdfjsLib.getDocument(originalPdfBytes).promise.then(pdf => {
                    pdfDoc = pdf;
                    renderAllPages().then(() => {
                        // Masquer le spinner et afficher les contrôles
                        loadingSpinner.style.display = 'none';
                        saveBtn.style.display = 'block';
                        labelCheckbox.style.display = 'block';
                        scaleToggle.style.display = 'block';
                        document.body.classList.remove('loading');
                    });
                });
            };

            fileReader.readAsArrayBuffer(file);
        }
    });

    // Déterminer l'échelle basée sur l'état de la case à cocher
    function getScale() {
        return scaleToggle.checked ? 0.45 : 0.60; // Échelle ajustable
    }

    // Rendu de toutes les pages du PDF
    async function renderAllPages() {
        pdfPreview.innerHTML = ''; // Réinitialiser l'aperçu
        rotations = Array(pdfDoc.numPages).fill(0); // Initialiser les rotations
        const renderPromises = []; // Suivre les rendus
        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            renderPromises.push(renderPage(pageNum));
        }
        await Promise.all(renderPromises); // Attendre le rendu complet
    }

    // Rendu d'une page spécifique
    function renderPage(pageNumber) {
        return new Promise((resolve) => {
            let pageContainer = document.querySelector(`.page-container[data-page-number="${pageNumber}"]`);
            if (!pageContainer) {
                pageContainer = document.createElement('div');
                pageContainer.classList.add('page-container');
                pageContainer.setAttribute('data-page-number', pageNumber);
                pdfPreview.appendChild(pageContainer);
            }
            pageContainer.innerHTML = ''; // Réinitialiser le conteneur

            pdfDoc.getPage(pageNumber).then(page => {
                const scale = getScale();
                const viewport = page.getViewport({ scale: scale, rotation: rotations[pageNumber - 1] });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    const rotateBtn = document.createElement('button');
                    rotateBtn.classList.add('rotate-btn');
                    rotateBtn.textContent = '\u21bb'; // Flèche circulaire
                    rotateBtn.addEventListener('click', () => {
                        rotations[pageNumber - 1] = (rotations[pageNumber - 1] + 90) % 360;
                        renderPage(pageNumber); // Redessiner la page
                    });

                    pageContainer.appendChild(canvas);
                    pageContainer.appendChild(rotateBtn);

                    resolve(); // Rendu terminé
                });
            });
        });
    }

    // Re-rendre toutes les pages si la case à cocher change
    scaleToggle.addEventListener('change', () => {
        renderAllPages();
    });

    // Enregistrer le PDF avec les rotations appliquées
    saveBtn.addEventListener('click', async () => {
        const pdfDocLib = await PDFLib.PDFDocument.load(originalPdfBytes);
        const pages = pdfDocLib.getPages();

        pages.forEach((page, index) => {
            page.setRotation(PDFLib.degrees(rotations[index]));
        });

        const pdfBytes = await pdfDocLib.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    });

        saveBtn.style.display = 'none';
        labelCheckbox.style.display = 'none';
        scaleToggle.style.display = 'none';
    });
